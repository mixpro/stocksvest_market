<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StocksVest Automations</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>
  <header></header>
  <main>
    <aside id="sidebar">
      <div id="switch"></div>
      <div class="section-head"><h2>Automations</h2><button id="new-automation">+ New</button></div>
      <ul id="automation-list" class="list"></ul>
      <div class="section-head"><h2>Inbox</h2><button id="show-inbox" class="link">Open</button></div>
    </aside>
    <section id="editor">
      <p class="muted empty">Select an automation, or create a new one.</p>
    </section>
    <section id="results">
      <p class="muted empty">Preview, run, or open history to see results here.</p>
    </section>
  </main>
  <script src="common.js"></script>
  <script src="automations.js"></script>
</body>
</html>
