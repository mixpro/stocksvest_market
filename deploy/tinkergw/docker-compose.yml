# tinkergw (home server): what runs there. No source code on that machine: only this file, .env and data.
# Step 1 of the move: a dummy app to prove the VPS relay and login work. The real app and market service replace it.
services:
  whoami:
    image: traefik/whoami:v1.11.0     # prints every request it receives, headers included
    container_name: stocksvest-whoami
    command: ["--port", "8100", "--name", "stocksvest-dummy"]
    ports:
      - "100.126.3.52:8100:8100"      # Tailscale address only: reachable from the VPS, not from the LAN or internet
    restart: unless-stopped
