# The VPS edge: Authelia, the login service Caddy asks before forwarding a request, and Redis for its sessions.
# Runs from /opt/stocksvest-market/edge on the VPS (copied by scripts/deploy-edge.sh). Caddy itself runs on the host.
services:
  authelia:
    image: authelia/authelia:4.39.27
    container_name: stocksvest-authelia
    environment:
      TZ: UTC
      # Secrets are files created once on the VPS (scripts/deploy-edge.sh), never in git.
      AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET_FILE: /secrets/jwt
      AUTHELIA_SESSION_SECRET_FILE: /secrets/session
      AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE: /secrets/storage
      AUTHELIA_NOTIFIER_SMTP_PASSWORD_FILE: /secrets/smtp_password
    env_file: .env                    # AUTHELIA_NOTIFIER_SMTP_USERNAME (written by scripts/set-smtp-key.sh)
    volumes:
      - ./authelia:/config            # configuration.yml (from git), users.yml, data/, notifications.txt (VPS only)
      - ./secrets:/secrets:ro
    ports:
      - "127.0.0.1:9091:9091"         # only Caddy on the same host reaches it
    depends_on:
      - redis
    restart: unless-stopped

  # Logins live here instead of in Authelia's memory, so restarting Authelia doesn't log anyone out.
  # Only Authelia reaches it (no published port); the session data is encrypted with Authelia's session secret.
  redis:
    image: redis:7.4.10-alpine
    container_name: stocksvest-authelia-redis
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - ./redis:/data                 # survives Redis restarts too
    restart: unless-stopped
